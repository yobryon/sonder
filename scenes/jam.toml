# Jam — you're in the ensemble.
#
# Night Freeway's band, plus a seat for you. Play on the web page (press `p`, then the
# computer keyboard is a two-octave piano: zsxdcvgbhnjm, and q2w3er5t6y7u; or plug in a
# MIDI keyboard and click MIDI), in the TUI (`p` toggles play mode), or send
# `{"cmd":"human_note","key":60,"velocity":0.8,"on":true}` over the WebSocket.
#
# Your keys are snapped to the conductor's harmony on the way in (`snap = "scale"`;
# try `"chord"` for a guaranteed-consonant pad or `"none"` to play exactly what you
# press). Phrases of three or more notes followed by a beat of silence are answered by
# the `duet` lead with a figure that echoes your last interval. How much you play feeds
# the mood (energy) like any other layer.
#
# With a hardware keyboard on the native engine you can skip the UI entirely:
#   source = { kind = "human.midi" }                      # first MIDI input port
#   source = { kind = "human.midi", port = "Arturia" }    # port by name (substring)
#   source = { kind = "human.midi", port = "virtual" }    # a virtual port a DAW can target
# and then readings `activity` / `register` / `pressure` are yours to map:
#   map.energy = "norm(smooth(field('activity'), 2))"
#   map.register = "field('register')"

name = "Jam"
description = "Night Freeway with a seat for you: play along on a nylon string, the lead answers."
tags = ["ambient", "offline", "play-along", "founding"]
viz = "freeway"

[conductor]
key = "D"
mode = "lydian"
tempo = 62
tempo_range = [56, 76]
drift = "slow"
progression = "modal"
bars_per_chord = 2
mood_smoothing = 30
mood_baseline = [0.35, 0.25, 0.55]
humanize = 0.2

[conductor.form]
call_and_response = true

[effects.reverb]
size = 0.9
damping = 0.35
level = 0.9

[effects.delay]
beats = 0.75
feedback = 0.4

# ── you ───────────────────────────────────────────────────────────────────────

[[layer]]
name = "you"
role = "human"
instrument = "string.nylon"
# No source: notes arrive as `human_note` commands from the web page / TUI.
# For a hardware keyboard use e.g. `source = { kind = "human.midi" }` (see above).
on_event.note.snap = "scale"          # chord | scale | none
map.reverb = "0.5"
map.volume = "0.9"

[[layer]]
name = "duet"
role = "lead"
instrument = "lead.soft"
# Mostly listens; answers your phrases (call-and-response) and noodles sparingly.
map.density  = "0.15"
map.register = "0.6"
map.volume   = "0.6"
map.delay    = "0.4"

# ── the road (Night Freeway) ─────────────────────────────────────────────────

[[layer]]
name = "traffic"
role = "pad"
instrument = "pad.glass"
source = { kind = "synthetic.freeway", lanes = 4, flow = 0.4, speed = 0.55, rush = 300 }
signals.flow     = "norm(smooth(rate(event('*'), 20), 4))"
signals.speed    = "norm(smooth(field('mean_speed'), 6))"
signals.crowd    = "norm(smooth(field('count'), 3))"
map.energy       = "0.6 * flow + 0.4 * crowd"
map.brightness   = "speed"
map.density      = "crowd"
map.register     = "0.35 + 0.3 * speed"
map.cutoff       = "0.3 + 0.6 * speed"
map.reverb       = "0.5 + 0.4 * (1 - crowd)"

[[layer]]
name = "headlights"
role = "pluck"
instrument = "pluck.glass"
source = "traffic"
signals.flow = "norm(smooth(rate(event('*'), 20), 4))"
map.register = "0.4 + 0.3 * (1 - flow)"
map.volume   = "0.7"
on_event."*".pitch    = "1 - clamp(attr('size'), 0, 1) * 0.7 + 0.3 * attr('speed')"
on_event."*".velocity = "0.35 + 0.65 * clamp(attr('brightness'), 0, 1)"
on_event."*".pan      = "attr('x')"
on_event."*".length   = "0.5 + 2 * clamp(attr('size'), 0, 1)"
on_event."*".quantize = "1/16"
on_event."*".snap     = "chord"

[[layer]]
name = "undertow"
role = "bass"
instrument = "bass.sub"
source = "traffic"
signals.flow = "norm(smooth(rate(event('*'), 30), 8))"
map.density  = "0.15 + 0.5 * flow"
map.volume   = "0.8"

[[layer]]
name = "asphalt"
role = "texture"
instrument = "texture.wind"
source = "traffic"
signals.speed = "norm(smooth(field('mean_speed'), 10))"
signals.crowd = "norm(smooth(field('count'), 10))"
map.texture   = "0.2 + 0.6 * crowd"
map.cutoff    = "0.2 + 0.5 * speed"
map.volume    = "0.3"
map.pan       = "0.5 + 0.2 * walk(0.3, 20)"
