[package]
name = "sonder-engine"
description = "Wires sources -> features -> composer -> synth -> output; publishes snapshots"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sonder-core = { workspace = true }
sonder-expr = { workspace = true }
sonder-theory = { workspace = true }
sonder-compose = { workspace = true }
sonder-dsp = { workspace = true }
sonder-sources = { workspace = true, optional = true, default-features = false }
sonder-vision = { workspace = true, optional = true, default-features = false }
sonder-audio = { workspace = true, default-features = false }
# `sync` alone is wasm-friendly; `native` turns on the rest.
tokio = { version = "1", default-features = false, features = ["sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true, optional = true }
hound = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
midir = { workspace = true, optional = true }
flate2 = { version = "1.1", optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
rosc = { version = "0.11", optional = true }
rusty_link = { version = "0.4", optional = true }

[features]
default = ["native", "native-audio", "midi", "osc"]
## Live mode, offline render, the source registry (tokio runtime, network sources, camera).
## Without it only the control loop, scene library and validation compile — for wasm.
native = [
    "dep:sonder-sources", "sonder-sources/native",
    "dep:sonder-vision", "sonder-vision/native",
    "dep:reqwest", "dep:hound", "dep:rand", "dep:flate2", "dep:tokio-tungstenite", "dep:futures",
    "tokio/rt", "tokio/rt-multi-thread", "tokio/time", "tokio/macros", "tokio/test-util",
]
native-audio = ["native", "sonder-audio/native-audio"]
midi = ["native", "midir"]
## OSC out (`--osc host:port`): notes, drums, layer params, signals, harmony, form over UDP.
osc = ["native", "dep:rosc"]
## Ableton Link (`--link`). Off by default: builds the C++ Link library (needs cmake, a C++ compiler and libclang for bindgen).
link = ["native", "dep:rusty_link"]
