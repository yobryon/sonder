[package]
name = "sonder-wasm"
description = "Sonder in the browser: the engine as a wasm-bindgen module driven from a Web Worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sonder-core = { workspace = true }
sonder-engine = { workspace = true, default-features = false }
sonder-audio = { workspace = true, default-features = false }
sonder-sources = { workspace = true, default-features = false }
sonder-vision = { workspace = true, default-features = false }
sonder-dsp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { version = "1", default-features = false, features = ["sync"] }
wasm-bindgen = "0.2.100"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
js-sys = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
