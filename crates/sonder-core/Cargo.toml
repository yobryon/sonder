[package]
name = "sonder-core"
description = "Shared types for Sonder: samples, scenes, instruments, synth commands, snapshots"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# `rand` pulls in getrandom, which refuses to build for wasm32-unknown-unknown unless the
# JS backend is enabled (plus `--cfg getrandom_backend="wasm_js"`, set in .cargo/config.toml).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
