[package]
name = "sonder"
description = "Sonder CLI: play, list, probe, render, serve"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sonder-core = { workspace = true }
sonder-engine = { workspace = true, default-features = false }
sonder-web = { workspace = true }
sonder-tui = { workspace = true }
sonder-sources = { workspace = true }
sonder-dsp = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["native-audio"]
native-audio = ["sonder-engine/native-audio"]

[[bin]]
name = "sonder"
path = "src/main.rs"
