[package]
name = "sonder-sources"
description = "Live data source adapters + registry + probe"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sonder-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
sysinfo = { workspace = true, optional = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true, optional = true }
rand = { workspace = true }
rand_chacha = { workspace = true }

[features]
default = ["native"]
## Async adapters, the registry and network/system access (tokio, reqwest, sysinfo).
## Without it only the pure parts compile (simulations, astro math, jsonpath) — for wasm.
native = ["dep:tokio", "dep:tokio-stream", "dep:futures", "dep:reqwest", "dep:tokio-tungstenite", "dep:sysinfo", "dep:bytes"]

[dev-dependencies]
sonder-expr = { workspace = true }
